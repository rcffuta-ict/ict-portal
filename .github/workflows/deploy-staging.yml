name: Deploy migrations — staging

# Staging and development share one Supabase project, because the Free plan allows
# two active projects per organisation and production holds the other one. So a push
# to `stage` and a push to any `dev/*` branch both land in the same database.
#
# That is a real limitation, not a design choice: a staging rehearsal here runs against
# test-seeded data, so it proves a migration APPLIES but not how it behaves on the
# production dataset. Read docs/DATABASE-CICD.md before trusting a green run.
on:
    push:
        branches:
            - stage
            - dev
            - "dev/**"
        paths:
            - "supabase/migrations/**"
            - ".github/workflows/deploy-staging.yml"
    workflow_dispatch:

# Two pushes in quick succession would otherwise race to apply migrations to the same
# database. Queue them instead; never cancel one mid-apply.
concurrency:
    group: supabase-staging
    cancel-in-progress: false

jobs:
    migrate:
        name: supabase db push (staging)
        runs-on: ubuntu-latest
        environment: staging

        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
            SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

        steps:
            - uses: actions/checkout@v4

            - uses: supabase/setup-cli@v1
              with:
                  version: latest

            - name: Link to the staging project
              run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

            - name: Show what is about to be applied
              run: supabase migration list

            - name: Apply pending migrations
              run: supabase db push
