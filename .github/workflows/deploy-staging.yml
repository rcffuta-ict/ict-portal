name: Deploy migrations — staging

# `stage` is the ONLY branch that writes to the staging project.
#
# dev/** deliberately does not deploy. A dev branch is where a migration is still
# being written, and half-finished SQL applied to a shared database is worse than no
# automation at all -- migrations are forward-only here, so an accidental apply cannot
# be taken back, it can only be patched over. Dev branches still get checked: ci.yml
# rebuilds the whole schema from zero on every push to dev/**, against a throwaway
# Postgres that nobody else can see.
#
# So the path for a migration is: write it on dev/**, let CI prove it applies from
# scratch, merge to `stage` to put it on the real staging database, then to `main`.
on:
    push:
        branches:
            - stage
        paths:
            - "supabase/migrations/**"
            - ".github/workflows/deploy-staging.yml"
    workflow_dispatch:

# Two pushes in quick succession would otherwise race to apply migrations to the same
# database. Queue them instead; never cancel one mid-apply.
concurrency:
    group: supabase-staging
    cancel-in-progress: false

jobs:
    migrate:
        name: supabase db push (staging)
        runs-on: ubuntu-latest
        environment: staging

        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
            SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

        steps:
            - uses: actions/checkout@v4

            - uses: supabase/setup-cli@v1
              with:
                  version: latest

            - name: Link to the staging project
              run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

            # Written to the job summary as well as the log, so the outcome is readable
            # from the Actions tab without opening a single step.
            - name: Show what is pending
              run: |
                  {
                      echo "## Staging — \`$SUPABASE_PROJECT_ID\`"
                      echo
                      echo '```'
                      supabase migration list
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Apply pending migrations
              # pipefail matters here: without it the pipeline reports tee's exit code,
              # so a migration that FAILED would show as a green deploy.
              run: |
                  set -o pipefail
                  {
                      echo "### Result"
                      echo '```'
                      supabase db push 2>&1 | tee /dev/stderr
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
