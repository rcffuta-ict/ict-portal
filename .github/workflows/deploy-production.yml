name: Deploy migrations — production

# Push to main -> apply pending migrations to the production Supabase project.
#
# The Free plan has NO automatic backups and NO point-in-time recovery. If a migration
# corrupts production there is no restore button; the only undo is the system-insurance
# backup taken from the portal (Settings -> System insurance). Take one before merging
# anything that drops or rewrites data.
#
# Protect this properly: in repository Settings -> Environments -> production, add
# yourself as a required reviewer. The job then pauses for approval before touching the
# database, which turns "I pushed to main" into a deliberate act.
on:
    push:
        branches:
            - main
        paths:
            - "supabase/migrations/**"
            - ".github/workflows/deploy-production.yml"
    workflow_dispatch:

concurrency:
    group: supabase-production
    cancel-in-progress: false

jobs:
    migrate:
        name: supabase db push (production)
        runs-on: ubuntu-latest
        environment: production

        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
            SUPABASE_PROJECT_ID: ${{ vars.PRODUCTION_PROJECT_ID || secrets.PRODUCTION_PROJECT_ID }}

        steps:
            - uses: actions/checkout@v4

            - uses: supabase/setup-cli@v1
              with:
                  version: latest

            # Diagnosing a link failure is hard when the ref is masked, so the ref comes
            # from a repository VARIABLE, falling back to a secret if you already made
            # one. A project ref is not a secret -- it is in the URL of every dashboard
            # page and in docs/DATABASE-CICD.md.
            #
            # This step exists because `supabase link` reports every authorisation
            # problem with one opaque message ("Authorization failed for the access
            # token and project ref pair"), which covers a wrong token, an expired
            # token, a token from a different Supabase ACCOUNT, and a scoped token that
            # simply was not given this project. Listing what the token can actually
            # see separates those in one glance.
            - name: Check the token can see this project
              run: |
                  set -o pipefail
                  echo "Target project ref: ${SUPABASE_PROJECT_ID:-(EMPTY - the variable is not set)}"

                  if [ -z "$SUPABASE_PROJECT_ID" ]; then
                      echo "::error::PROJECT_ID is empty. Set it under Settings -> Secrets and variables -> Actions -> Variables."
                      exit 1
                  fi

                  # Listing is DIAGNOSTIC, never the verdict. A scoped token can be
                  # granted one project without being allowed to enumerate the
                  # organisation, so a failure here does not mean the token is bad --
                  # only `link` can decide that.
                  if supabase projects list > projects.txt 2>&1; then
                      cat projects.txt
                      if ! grep -q "$SUPABASE_PROJECT_ID" projects.txt; then
                          echo "::error::Token is valid but $SUPABASE_PROJECT_ID is not among the projects it can see. Either the token belongs to a different Supabase account, or it is a scoped token that was not granted this project."
                          exit 1
                      fi
                      echo "Token can see $SUPABASE_PROJECT_ID."
                  else
                      cat projects.txt
                      echo "::notice::Could not list projects. That is not conclusive -- a scoped token may be allowed to use one project without listing the organisation. Continuing to link."
                  fi

            - name: Link to the production project
              run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

            - name: Explain a link failure
              if: failure()
              run: |
                  {
                      echo "### Link failed"
                      echo
                      echo "\`supabase link\` reports every authorisation problem with the same sentence."
                      echo "Check, in this order:"
                      echo
                      echo "1. Does the token belong to the account that owns \`$SUPABASE_PROJECT_ID\`?"
                      echo "   Right after consolidating accounts, a token from the old one looks valid but sees nothing."
                      echo "2. Is it a SCOPED token? Scoped tokens are in public alpha and are known to fail"
                      echo "   \`link\`, even on the Full access preset, because link reveals project API keys:"
                      echo "   https://github.com/supabase/supabase/issues/50244  -- use a classic token."
                      echo "3. Is the token expired or revoked?"
                      echo
                      echo "Locally: \`SUPABASE_ACCESS_TOKEN=sbp_xxx supabase projects list\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Show what is about to be applied
              run: |
                  {
                      echo "## Production — \`$SUPABASE_PROJECT_ID\`"
                      echo
                      echo '```'
                      supabase migration list
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Apply pending migrations
              # pipefail matters here: without it the pipeline reports tee's exit code,
              # so a migration that FAILED would show as a green deploy.
              run: |
                  set -o pipefail
                  {
                      echo "### Result"
                      echo '```'
                      supabase db push 2>&1 | tee /dev/stderr
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            # Supabase's API (PostgREST) keeps a cached map of the schema and should rebuild
            # it after DDL, but after the 1.0.0 release production kept serving the stale
            # map. Every read then got 503 "schema cache not loaded", which supabase-js
            # retries with backoff, and sign-in took 35 s until someone ran this by hand.
            # Always ask for the rebuild; it is harmless when nothing changed.
            - name: Reload the API's schema cache
              if: success()
              run: supabase db query --linked "notify pgrst, 'reload schema';"
