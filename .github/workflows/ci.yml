name: CI

# Runs on every PR, and on direct pushes to the long-lived branches.
#
# SQL only. Linting and building the app is Vercel's job -- it already does both on
# every push, and duplicating them here meant two places to read a failure from and
# two places to keep the Node version in step.
#
# dev/** is included deliberately: those branches never deploy, so this replay is the
# only feedback a migration gets before it reaches `stage`. It builds the schema in a
# throwaway Postgres inside the runner and never connects to a real project.
on:
    pull_request:
    push:
        branches:
            - main
            - stage
            - dev
            - "dev/**"

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    migrations:
        name: Replay migrations from zero
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: supabase/setup-cli@v1
              with:
                  version: latest

            # Starts the local Postgres only -- everything else is excluded, because
            # this job tests SQL, not the API gateway or Studio. `supabase start`
            # applies every file in supabase/migrations/ in order against an empty
            # database, so it fails on exactly the class of error that cost us a
            # rolled-back production apply before: a DROP whose dependent view is
            # invisible to a TypeScript grep.
            # --ignore-health-check because THE DATABASE IS THE ONLY SERVICE THIS JOB
            # TESTS. The exclusion list below is honoured unevenly -- PostgREST has
            # started and then failed its readiness probe on 127.0.0.1:54321 even when
            # excluded, and that probe goes through Kong, which is also excluded, so it
            # could never have answered. Failing the PR over an API gateway nobody asked
            # for, in a job about SQL, is noise.
            #
            # This does NOT weaken the check. The next two steps are the real gate: if
            # Postgres had not come up, `db reset` and the seed would fail immediately
            # and loudly. A green run still means the migrations replayed from zero.
            - name: Build the schema from scratch
              run: >
                  supabase start
                  --ignore-health-check
                  -x studio,imgproxy,inbucket,edge-runtime,functions,realtime,storage,analytics,vector,kong,rest,meta

            # `db reset` re-runs the whole series a second time on a fresh database.
            # A migration that passes once but breaks on replay is a migration that
            # will break the next time anyone rebuilds an environment.
            - name: Replay a second time
              run: supabase db reset

            # The bootstrap seed is a few hundred lines of INSERTs that must still
            # fit the schema. Applying it here means a migration that breaks it fails
            # the PR rather than the next time someone builds an environment.
            #
            # psql, not `supabase db query -f`: that sends the whole file as a single
            # prepared statement, and a prepared statement carries exactly one command,
            # so any multi-statement file fails with "cannot insert multiple commands
            # into a prepared statement" before a single row is written.
            #
            # ON_ERROR_STOP=1 is what makes this a check at all -- psql's default is to
            # report a failed statement and carry on to the next, exiting 0, which would
            # turn a broken seed into a green run.
            - name: Apply the bootstrap seed
              run: >
                  psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
                  -v ON_ERROR_STOP=1
                  -f db/seed/default.sql

            - name: Lint the resulting schema
              run: supabase db lint --local --level warning --fail-on error

            - name: Stop
              if: always()
              run: supabase stop --no-backup
